<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio botões</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

        button {
            font-family: 'Roboto';
        }

        #botao1 {
            color: #589edf;
            background-color: white;
            border: 1px solid white;
            font-weight: bold;
            border-radius: 5px;
            padding: 8px 12px;
        }

        #botao2 {
           color: #589edf;
           font-weight: bold;
           background-color: #99c2e9;
           border: 1px solid #99c2e9;
           border-radius: 5px;
           padding: 8px 12px;

        }

        #botao3 {
            color: white;
            background-color: #589edf;
            border: 1px solid #589edf;
            border-radius: 5px;
            padding: 8px 12px;

        }

        #botao4 {
            color: #589edf;
            background-color: white;
            border: 1px solid #589edf;
            border-radius: 5px;
            padding: 8px 12px;
            font-weight: bold;
            
        }
        
        #botao5 {
            color: black;
            background-color: white;
            border: 1px solid #CED4DA;
            border-radius: 5px;
            font-weight: bold;
            padding: 8px 12px;
            
        }
    </style>
</head>
<body>
    <button id="botao1">Subtle variant</button>
    <button id="botao2">Light variant</button>
    <button id="botao3">Filled variant</button>
    <button id="botao4">Outline variant</button>
    <button id="botao5">Default variant</button>
</body>
</html>
